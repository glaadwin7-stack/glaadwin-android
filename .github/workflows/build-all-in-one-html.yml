name: Export All-in-One Glaadwin AI HTML

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Combine everything into one working index.html
        run: |
          python3 - << 'PYEOF'
          import os, glob, base64, re

          candidates = sorted(glob.glob("app/src/main/assets/*.html") + glob.glob("*.html"))
          if not candidates:
              raise SystemExit("No HTML file found in app/src/main/assets/ or root.")
          src_html = next((c for c in candidates if os.path.basename(c) == "index.html"), candidates[0])
          with open(src_html, "r", encoding="utf-8") as f:
              html = f.read()

          # 1. Embed custom logo as favicon if present
          logo_candidates = glob.glob("app/src/main/res/drawable/ic_launcher.*")
          if logo_candidates:
              logo_path = logo_candidates[0]
              ext = os.path.splitext(logo_path)[1].lower().lstrip(".")
              mime = "image/jpeg" if ext in ("jpg", "jpeg") else "image/png"
              with open(logo_path, "rb") as lf:
                  b64 = base64.b64encode(lf.read()).decode("ascii")
              data_uri = f"data:{mime};base64,{b64}"
              if re.search(r'<link[^>]+rel="icon"[^>]*>', html):
                  html = re.sub(r'<link[^>]+rel="icon"[^>]*>', f'<link rel="icon" type="{mime}" href="{data_uri}" />', html, count=1)
              else:
                  html = html.replace("</head>", f'<link rel="icon" type="{mime}" href="{data_uri}" />\n</head>', 1)

          # 2. Add SEO & Security meta headers
          head_inject = ""
          if 'name="referrer"' not in html:
              head_inject += '<meta name="referrer" content="strict-origin-when-cross-origin" />\n'
          if 'name="description"' not in html:
              head_inject += '<meta name="description" content="Glaadwin AI — Personal voice assistant with Firebase sign-in, voice commands, and ElevenLabs voice." />\n'
          if head_inject:
              html = html.replace("</head>", head_inject + "</head>", 1)

          # 3. Fix Persistence.NONE login loop if present
          html = html.replace("firebase.auth.Auth.Persistence.NONE", "firebase.auth.Auth.Persistence.LOCAL")

          # 4. Inject Web ElevenLabs + Cookie/Privacy/DPDP + Security bundle
          if "gw-all-in-one-bundle" not in html:
              bundle = """
          <!-- gw-all-in-one-bundle -->
          <style>
          html, body { overflow-x: hidden !important; max-width: 100% !important; }
          .gw-footer { width:100%; padding:14px 16px 24px; margin-top:16px; border-top:1px solid rgba(34,211,238,0.16); background:rgba(4,9,20,0.92); color:#94a3b8; font-size:12px; text-align:center; }
          .gw-footer a, .gw-cookie-banner a, .gw-policy-modal a { color:#22d3ee; text-decoration:underline; cursor:pointer; }
          .gw-footer-links { display:flex; flex-wrap:wrap; justify-content:center; gap:10px 16px; margin-bottom:8px; }
          .gw-cookie-banner { position:fixed; left:12px; right:12px; bottom:12px; z-index:9999; max-width:680px; margin:0 auto; padding:14px 16px; border-radius:14px; background:#081224; border:1px solid rgba(34,211,238,0.35); color:#e2e8f0; font-size:13px; display:none; flex-direction:column; gap:10px; }
          .gw-cookie-actions { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }
          .gw-btn { padding:8px 14px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; border:1px solid rgba(34,211,238,0.45); }
          .gw-btn-primary { background:#22d3ee; color:#040914; }
          .gw-btn-dark { background:#0f172a; color:#e2e8f0; }
          .gw-btn-danger { background:rgba(127,29,29,0.4); color:#fecaca; border-color:rgba(248,113,113,0.45); }
          .gw-voice-fab { position:fixed; right:14px; bottom:72px; z-index:9998; background:#081224; color:#22d3ee; border:1px solid rgba(34,211,238,0.45); border-radius:999px; padding:9px 14px; font-size:12px; font-weight:600; cursor:pointer; }
          .gw-policy-backdrop { position:fixed; inset:0; z-index:10000; background:rgba(2,6,16,0.82); display:none; align-items:center; justify-content:center; padding:16px; }
          .gw-policy-modal { width:100%; max-width:600px; max-height:82vh; overflow-y:auto; background:#081224; border:1px solid rgba(34,211,238,0.35); border-radius:16px; padding:18px 20px; color:#e2e8f0; font-size:13px; line-height:1.55; }
          .gw-policy-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid rgba(34,211,238,0.2); }
          .gw-policy-head h2 { margin:0; font-size:16px; color:#22d3ee; }
          .gw-input { width:100%; padding:10px; margin:6px 0 12px; border-radius:8px; border:1px solid rgba(34,211,238,0.35); background:#040914; color:#e2e8f0; font-size:13px; }
          .gw-toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:10001; background:#081224; color:#e2e8f0; border:1px solid #22d3ee; padding:10px 16px; border-radius:10px; font-size:13px; display:none; }
          </style>
          <footer class="gw-footer">
            <div class="gw-footer-links">
              <a onclick="window.gwOpenPolicy('privacy')">Privacy Policy</a>
              <a onclick="window.gwOpenPolicy('terms')">Terms of Service</a>
              <a onclick="window.gwOpenPolicy('cookies')">Cookie Policy</a>
              <a onclick="window.gwOpenPolicy('dpdp')">DPDP Rights</a>
              <a onclick="window.gwShowCookieBanner(true)">Cookie Settings</a>
              <a href="mailto:support@glaadwin.ai">Contact</a>
            </div>
            <div>&copy; 2026 Glaadwin AI. All rights reserved.</div>
          </footer>
          <div id="gw-cookie-banner" class="gw-cookie-banner">
            <div><strong>Cookie Notice:</strong> Essential storage keeps sign-in, notes, tasks, and voice settings working. Optional analytics stay off unless you tap <strong>Accept All</strong>.</div>
            <div class="gw-cookie-actions">
              <button type="button" class="gw-btn gw-btn-dark" id="gw-cookie-reject">Reject Optional</button>
              <button type="button" class="gw-btn gw-btn-primary" id="gw-cookie-accept">Accept All</button>
            </div>
          </div>
          <button type="button" id="gw-voice-fab" class="gw-voice-fab">Voice (ElevenLabs)</button>
          <div id="gw-policy-backdrop" class="gw-policy-backdrop">
            <div class="gw-policy-modal">
              <div class="gw-policy-head"><h2 id="gw-policy-title">Glaadwin AI</h2><button type="button" class="gw-btn gw-btn-dark" id="gw-policy-close">Close</button></div>
              <div id="gw-policy-body"></div>
            </div>
          </div>
          <div id="gw-toast" class="gw-toast"></div>
          <script>
          (function(){
            const EL_KEY='glaadwin_elevenlabs_key', EL_VOICE='glaadwin_elevenlabs_voice', DEF_VOICE='JBFqnCBsd6RMkjVDRZzb', COOKIE_KEY='glaadwin_cookie_consent';
            let audioObj=null;
            const cleanKey=k=>{k=(k||'').trim(); return k.startsWith('Sk_')?('sk_'+k.slice(3)):k;};
            const getKey=()=>{try{return cleanKey(localStorage.getItem(EL_KEY));}catch(e){return '';}};
            const getVoice=()=>{try{return (localStorage.getItem(EL_VOICE)||'').trim()||DEF_VOICE;}catch(e){return DEF_VOICE;}};
            window.gwToast=(m,err)=>{const el=document.getElementById('gw-toast');if(!el)return;el.textContent=m;el.style.borderColor=err?'#f87171':'#22d3ee';el.style.display='block';clearTimeout(window.__gwT);window.__gwT=setTimeout(()=>el.style.display='none',3200);};
            window.gwShowCookieBanner=f=>{const b=document.getElementById('gw-cookie-banner');if(!b)return;let s=null;try{s=localStorage.getItem(COOKIE_KEY);}catch(e){}if(f||!s)b.style.display='flex';};
            const saveCookie=m=>{try{localStorage.setItem(COOKIE_KEY,m);}catch(e){}document.getElementById('gw-cookie-banner').style.display='none';window.gwToast('Preferences saved.');};
            async function speakEL(txt,fb){
              const k=getKey(); if(!k||!txt){if(fb)fb();return;}
              try{
                const r=await fetch('https://api.elevenlabs.io/v1/text-to-speech/'+encodeURIComponent(getVoice()),{method:'POST',headers:{'xi-api-key':k,'Content-Type':'application/json','Accept':'audio/mpeg'},body:JSON.stringify({text:txt,model_id:'eleven_flash_v2_5'})});
                if(!r.ok)throw 0;
                const u=URL.createObjectURL(await r.blob());
                if(audioObj){try{audioObj.pause();}catch(e){}}
                audioObj=new Audio(u); audioObj.onended=()=>URL.revokeObjectURL(u); await audioObj.play();
              }catch(e){if(fb)fb();}
            }
            if(window.speechSynthesis){
              const orig=window.speechSynthesis.speak.bind(window.speechSynthesis);
              window.speechSynthesis.speak=function(ut){
                if(window.GlaadwinAndroid&&window.GlaadwinAndroid.isElevenLabsReady&&window.GlaadwinAndroid.isElevenLabsReady()){window.GlaadwinAndroid.speakElevenLabs(String(ut&&ut.text||''));return;}
                if(getKey()&&ut&&ut.text){speakEL(String(ut.text),()=>orig(ut));return;}
                return orig(ut);
              };
            }
            const origOpen=window.open;
            if(typeof origOpen==='function'){window.open=(u,t,f)=>origOpen.call(window,u,t||'_blank',f?f+',noopener,noreferrer':'noopener,noreferrer');}
            const docs={
              privacy:{t:'Privacy Policy',h:'<p>Glaadwin AI collects only minimum sign-in details (via Google Firebase) and uses microphone input only when you activate voice features. Notes, tasks, and optional API keys stay locally on your device.</p><button class="gw-btn gw-btn-danger" onclick="window.gwClearData()">Delete Local Data &amp; Withdraw Consent</button>'},
              terms:{t:'Terms of Service',h:'<p>Glaadwin AI is a free personal voice assistant. AI outputs may contain mistakes; do not rely on them for medical, legal, or emergency decisions.</p>'},
              cookies:{t:'Cookie Policy',h:'<p>Essential local storage keeps sign-in, notes, tasks, and voice settings working. Optional analytics are disabled unless accepted.</p>'},
              dpdp:{t:'India DPDP Data Rights',h:'<p>Users under 18 require parental/guardian consent. You can withdraw consent and erase local data anytime below.</p><button class="gw-btn gw-btn-danger" onclick="window.gwClearData()">Delete Local Data &amp; Withdraw Consent</button>'}
            };
            window.gwOpenPolicy=k=>{const d=docs[k]||docs.privacy;document.getElementById('gw-policy-title').textContent=d.t;document.getElementById('gw-policy-body').innerHTML=d.h;document.getElementById('gw-policy-backdrop').style.display='flex';};
            window.gwClearData=()=>{try{localStorage.clear();}catch(e){}document.getElementById('gw-policy-backdrop').style.display='none';window.gwToast('Local data cleared.');window.gwShowCookieBanner(true);};
            document.addEventListener('DOMContentLoaded',()=>{
              document.getElementById('gw-cookie-accept').onclick=()=>saveCookie('all');
              document.getElementById('gw-cookie-reject').onclick=()=>saveCookie('essential');
              document.getElementById('gw-policy-close').onclick=()=>document.getElementById('gw-policy-backdrop').style.display='none';
              const fab=document.getElementById('gw-voice-fab');
              if(window.GlaadwinAndroid&&window.GlaadwinAndroid.isAndroidApp&&window.GlaadwinAndroid.isAndroidApp()){fab.style.display='none';}
              fab.onclick=()=>{
                document.getElementById('gw-policy-title').textContent='ElevenLabs Voice Settings';
                document.getElementById('gw-policy-body').innerHTML='<p>Stored privately on your device only.</p><input id="gw-ek" class="gw-input" type="password" placeholder="ElevenLabs API Key (sk_...)" /><input id="gw-ev" class="gw-input" type="text" placeholder="Voice ID (default: George)" /><button id="gw-es" class="gw-btn gw-btn-primary">Save &amp; Test</button> <button id="gw-ec" class="gw-btn gw-btn-danger">Clear</button>';
                document.getElementById('gw-ek').value=getKey();
                document.getElementById('gw-ev').value=getVoice();
                document.getElementById('gw-es').onclick=()=>{const k=cleanKey(document.getElementById('gw-ek').value),v=(document.getElementById('gw-ev').value||'').trim()||DEF_VOICE;try{localStorage.setItem(EL_KEY,k);localStorage.setItem(EL_VOICE,v);}catch(e){}document.getElementById('gw-policy-backdrop').style.display='none';if(k)speakEL('Glaadwin AI online. ElevenLabs voice is ready.',()=>window.gwToast('Voice test failed — check key.',true));};
                document.getElementById('gw-ec').onclick=()=>{try{localStorage.removeItem(EL_KEY);}catch(e){}document.getElementById('gw-policy-backdrop').style.display='none';window.gwToast('ElevenLabs cleared.');};
                document.getElementById('gw-policy-backdrop').style.display='flex';
              };
              window.gwShowCookieBanner(false);
            });
          })();
          </script>
          """
              html = html.replace("</body>", bundle + "\n</body>", 1)

          os.makedirs("output", exist_ok=True)
          with open("output/index.html", "w", encoding="utf-8") as out:
              out.write(html)
          print(f"Combined all-in-one output/index.html ({len(html)} bytes)")
          PYEOF

      - name: Upload single all-in-one index.html
        uses: actions/upload-artifact@v4
        with:
          name: glaadwin-ai-all-in-one-html
          path: output/index.html
          if-no-files-found: error
          
