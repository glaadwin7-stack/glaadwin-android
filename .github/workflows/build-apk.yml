name: Build Glaadwin AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Download and bundle Vosk English model
        run: |
          mkdir -p /tmp/vosk
          curl -fSL https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -o /tmp/vosk/model.zip
          unzip -q /tmp/vosk/model.zip -d /tmp/vosk
          rm -rf app/src/main/assets/model-en-us
          mv /tmp/vosk/vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
          cat /proc/sys/kernel/random/uuid > app/src/main/assets/model-en-us/uuid

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Glaadwin AI APK
        uses: actions/upload-artifact@v4
        with:
          name: glaadwin-ai-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
