
name: Build Glaadwin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Glaadwin source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare Vosk voice model
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/vosk
          curl -fL --retry 5 \
            https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip \
            -o /tmp/vosk/model.zip
          unzip -t /tmp/vosk/model.zip
          unzip -q /tmp/vosk/model.zip -d /tmp/vosk
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/model-en-us
          mv /tmp/vosk/vosk-model-small-en-us-0.15 \
            app/src/main/assets/model-en-us
          echo "Voice model ready"

      - name: Build installable Android APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Check APK exists
        shell: bash
        run: |
          set -e
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "APK BUILD SUCCESSFUL"

      - name: Upload actual APK
        uses: actions/upload-artifact@v4
        with:
          name: Glaadwin-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
