
name: Build Glaadwin AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f "app/src/main/assets/Glaadwin AI (4).html"
          test -f app/google-services.json
          echo "All required project files found."

      - name: Prepare Android debug signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ -f app/debug-keystore.zip ]; then
            unzip -o -q app/debug-keystore.zip -d "$HOME/.android"
          fi

      - name: Download Vosk English voice model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vosk-download
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip \
            --output /tmp/vosk-download/model.zip

          unzip -t /tmp/vosk-download/model.zip
          unzip -q /tmp/vosk-download/model.zip -d /tmp/vosk-download

          MODEL_DIR="/tmp/vosk-download/vosk-model-small-en-us-0.15"
          test -d "$MODEL_DIR"

          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/model-en-us
          mv "$MODEL_DIR" app/src/main/assets/model-en-us

          test -d app/src/main/assets/model-en-us
          echo "Vosk voice model installed."

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test -s "$APK"
          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: glaadwin-ai-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
